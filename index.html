<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080f">
<title>Watch Together — private rooms</title>

<!-- Speed: warm up connections before we need them -->
<link rel="preconnect" href="https://www.youtube.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://www.google.com" crossorigin>
<link rel="preconnect" href="https://googlevideo.com" crossorigin>
<link rel="preconnect" href="https://fbqdpoqkbzbzvbrywaek.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://esm.sh">
<link rel="dns-prefetch" href="https://unpkg.com">

<!-- Speed: start YouTube API download in parallel with page load -->
<script src="https://www.youtube.com/iframe_api" async></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
:root{
  --bg:#08080f;--bg-soft:#0e0e1a;--text:#f2f2ff;--muted:#9a9ab5;
  --accent:#7c5cff;--accent-2:#4f8cff;--danger:#ff5c5c;--ok:#4ade80;
  --radius:18px;--radius-sm:14px;--shadow:0 8px 32px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
input,button,textarea,select{font-size:16px;font-family:inherit}

/* Landing */
body.landing{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-x:hidden;position:relative}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 50% at 15% 10%, rgba(124,92,255,.18), transparent 70%),radial-gradient(55% 45% at 90% 20%, rgba(79,140,255,.16), transparent 70%),radial-gradient(70% 60% at 50% 100%, rgba(124,92,255,.10), transparent 70%)}
.landing-wrap{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.brand{text-align:center;padding:8px 0 4px}
.brand-mark{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px rgba(124,92,255,.35)}
.brand-name{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.brand-tag{margin-top:6px;font-size:14.5px;color:var(--muted)}
.card{padding:18px;border-radius:var(--radius)}
.glass{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.field{display:block}
.field-label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field-help{margin-top:8px;font-size:12.5px;color:var(--muted)}
.input{width:100%;min-height:50px;padding:14px 16px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#fff;font-size:16px;outline:none}
.input:focus{border-color:rgba(124,92,255,.7);box-shadow:0 0 0 3px rgba(124,92,255,.22)}
.input::placeholder{color:#6f6f8d}
.code-input{text-align:center;text-transform:uppercase;letter-spacing:.35em;font-weight:800;font-size:20px;padding:16px 12px;background:rgba(0,0,0,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:14px 18px;border-radius:var(--radius-sm);border:1px solid transparent;font-family:inherit;font-size:16px;font-weight:700;color:#fff;cursor:pointer;text-decoration:none;user-select:none;touch-action:manipulation;transition:transform .12s ease, background .15s ease, opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 24px rgba(80,100,255,.32)}
.btn-ghost{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}
.btn-danger{background:rgba(255,60,60,.12);border-color:rgba(255,80,80,.35);color:#ffb4b4}
.btn-sm{min-height:42px;padding:10px 14px;font-size:15px}
.btn-block{width:100%}
.btn-send{width:auto;min-width:84px;padding:0 18px}
.btn-ico{font-size:18px;line-height:1}
.join-row{display:flex;gap:10px;align-items:stretch}
.join-row .input{flex:1;min-width:0}
.join-row .btn{width:auto;min-width:92px}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.status{min-height:22px;margin-top:8px;text-align:center;font-size:14px;color:#ffb4b4}
.status.ok{color:#b9ffd0}
.footnote{margin-top:18px;padding:0 8px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);max-width:calc(100vw - 32px);padding:12px 18px;border-radius:999px;background:rgba(18,18,30,.94);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:14px;text-align:center;backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Room */
body.room{height:100dvh;overflow:hidden;background:var(--bg)}
.room-app{display:flex;flex-direction:column;height:100dvh;width:100%;overflow:hidden;background:var(--bg-soft);position:relative}
.boot{position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:var(--bg)}
.boot.is-error .spinner{display:none}
.boot.is-error .boot-text{color:#f2f2ff;font-weight:600;max-width:32ch}
.boot-text{font-size:16px;color:var(--muted);text-align:center;max-width:32ch}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.topbar{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(10,10,18,.85);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(12px);z-index:20}
.icon-btn{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;text-decoration:none}
.code-chip{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-family:inherit}
.code-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.code-value{font-size:20px;font-weight:800;letter-spacing:.18em;font-variant-numeric:tabular-nums;line-height:1.1}
.online-chip{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:9px 12px;border-radius:999px;border:1px solid rgba(80,255,140,.25);background:rgba(80,255,140,.10);color:#b9ffd0;font-size:14px;font-weight:700}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

.stage{position:relative;flex-shrink:0;width:100%;aspect-ratio:16/9;max-height:42dvh;background:#000;overflow:hidden}
.stage-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:20px;text-align:center;color:var(--muted)}
.stage-empty-title{font-size:16px;font-weight:700;color:#ddd}
.stage-empty-sub{font-size:13.5px}
#ytWrap{position:absolute;inset:0;width:100%;height:100%}
#ytPlayer,#ytPlayer iframe{width:100%;height:100%;border:0}
.tap-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:14px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.20);background:rgba(0,0,0,.75);color:#fff;font-size:16px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}

.source-bar{display:flex;gap:8px;flex-shrink:0;padding:8px 10px;background:rgba(10,10,18,.65);border-bottom:1px solid rgba(255,255,255,.05)}
.source-bar .input{flex:1;min-width:0;min-height:42px;padding:10px 12px;font-size:14px}
.source-bar .btn{width:auto;min-height:42px;padding:0 14px;font-size:14px}

.controls{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:6px 10px;background:rgba(10,10,18,.75);border-bottom:1px solid rgba(255,255,255,.05)}
.ctl{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);color:#fff;font-size:16px;cursor:pointer}
.ctl:disabled{opacity:.35;cursor:not-allowed}
.time{min-width:36px;flex-shrink:0;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek{flex:1;min-width:0;height:24px;accent-color:var(--accent)}
.seek:disabled{opacity:.35}

.chat{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:rgba(8,8,16,.55)}
.chat-head{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.chat-title{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chat-hint{font-size:12px;color:var(--muted)}
.chat-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 14px}
.msg{max-width:85%;align-self:flex-start;padding:8px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.07);font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(79,140,255,.35));border-color:rgba(124,92,255,.40)}
.msg .who{display:block;margin-bottom:2px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.msg.me .who{color:#d9ccff}
.msg .body{color:#f2f2ff}
.msg .time{display:block;margin-top:4px;text-align:right;font-size:10.5px;color:var(--muted)}
.msg.sys{align-self:center;max-width:92%;background:rgba(255,255,255,.04);border-color:transparent;color:var(--muted);font-size:12.5px;text-align:center;border-radius:999px}

.composer{display:flex;gap:8px;flex-shrink:0;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:rgba(10,10,18,.90);border-top:1px solid rgba(255,255,255,.06)}
.composer .input{flex:1;min-width:0;min-height:48px;padding:12px 14px;font-size:16px}
.room-foot{flex-shrink:0;padding:10px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(10,10,18,.95);border-top:1px solid rgba(255,255,255,.06)}

.reactions{display:flex;gap:4px;flex-shrink:0;padding:6px 10px;overflow-x:auto;scrollbar-width:none;background:rgba(10,10,18,.55);border-bottom:1px solid rgba(255,255,255,.05)}
.reactions::-webkit-scrollbar{display:none}
.reaction-btn{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.reaction-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6}
.reaction-float{position:absolute;bottom:8%;left:50%;font-size:40px;line-height:1;transform:translateX(-50%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));animation:reactionFloat 3s cubic-bezier(.22,1,.36,1) forwards}
@keyframes reactionFloat{0%{transform:translate(-50%,12px) scale(.5);opacity:0}12%{transform:translate(-50%,0) scale(1.15);opacity:1}24%{transform:translate(-50%,-10px) scale(1);opacity:1}100%{transform:translate(-50%,-260px) scale(.9) rotate(var(--drift,0deg));opacity:0}}

.fs-exit{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:9999;width:44px;height:44px;align-items:center;justify-content:center;padding:0;border-radius:12px;border:1px solid rgba(255,255,255,.20);background:rgba(0,0,0,.72);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
body.is-fullscreen .fs-exit{display:flex}
.room-app:fullscreen{display:grid;grid-template-columns:1fr min(360px,34vw);grid-template-rows:1fr auto;grid-template-areas:"stage chat" "controls composer";width:100%;height:100%;background:#000}
.room-app:fullscreen .topbar,.room-app:fullscreen .source-bar,.room-app:fullscreen .room-foot{display:none!important}
.room-app:fullscreen .stage{grid-area:stage;aspect-ratio:auto;max-height:none;height:100%}
.room-app:fullscreen .controls{grid-area:controls;background:rgba(6,6,12,.92)}
.room-app:fullscreen .chat{grid-area:chat;border-left:1px solid rgba(255,255,255,.08);background:rgba(8,8,16,.96)}
.room-app:fullscreen .composer{grid-area:composer;border-left:1px solid rgba(255,255,255,.08)}

@media (min-width:700px){
  .landing-wrap{max-width:480px}
  .brand-name{font-size:30px}
  .room-app{max-width:720px;margin:0 auto;border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)}
  .stage{max-height:52dvh}
  .chat-list{padding:14px 18px}
}
@media (min-width:1024px){.room-app{max-width:820px}.stage{max-height:55dvh}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body class="landing">

<div class="bg-glow" aria-hidden="true"></div>

<main class="landing-wrap" id="landing">
  <header class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/></svg>
    </div>
    <h1 class="brand-name">Watch Together</h1>
    <p class="brand-tag">A tiny private YouTube room for two or three.</p>
  </header>

  <section class="card glass">
    <label class="field" for="nameInput">
      <span class="field-label">Your name</span>
      <input id="nameInput" class="input" type="text" maxlength="18" placeholder="e.g. Sam" autocomplete="nickname">
    </label>
    <p class="field-help">Shown next to your chat messages.</p>
  </section>

  <section class="card glass">
    <button id="createBtn" class="btn btn-primary btn-block" type="button">
      <span class="btn-ico">＋</span> Create Room
    </button>
    <div class="divider"><span>or join one</span></div>
    <form id="joinForm" class="join-row" autocomplete="off" novalidate>
      <input id="codeInput" class="input code-input" type="text" maxlength="6" placeholder="ROOM CODE" aria-label="Room code">
      <button class="btn btn-ghost" type="submit">Join</button>
    </form>
  </section>

  <p id="landingStatus" class="status" role="status" aria-live="polite"></p>
  <p class="footnote">No accounts, no uploads, no library. The room code is the only key.</p>
</main>

<div class="room-app" id="roomApp" hidden>
  <div class="boot" id="bootScreen">
    <div class="spinner" aria-hidden="true"></div>
    <p class="boot-text" id="bootText" role="status" aria-live="polite">Connecting…</p>
    <button id="bootRetry" class="btn btn-primary" type="button" hidden>Retry</button>
    <button id="bootBack" class="btn btn-ghost" type="button" hidden>Back to start</button>
  </div>

  <div id="roomContent" hidden style="display:flex;flex-direction:column;height:100%;min-height:0">
    <header class="topbar">
      <a class="icon-btn" href="?" id="backLink" aria-label="Leave room">←</a>
      <button class="code-chip" id="codeChip" type="button">
        <span class="code-label">CODE</span>
        <span class="code-value" id="codeValue">------</span>
      </button>
      <button class="icon-btn" id="shareBtn" type="button">↗</button>
      <div class="online-chip" title="People online">
        <span class="online-dot"></span>
        <span id="onlineCount">1</span>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="stage-empty" id="stageEmpty">
        <p class="stage-empty-title">Nothing playing yet</p>
        <p class="stage-empty-sub" id="stageEmptySub">Paste a YouTube link below.</p>
      </div>
      <div id="ytWrap" hidden><div id="ytPlayer"></div></div>
      <button class="tap-play" id="tapPlay" type="button" hidden>▶ Tap to play</button>
      <div class="reaction-layer" id="reactionLayer" aria-hidden="true"></div>
    </section>

    <form class="source-bar" id="sourceBar" autocomplete="off" novalidate hidden>
      <input id="sourceInput" class="input" type="text" placeholder="YouTube link or video ID" autocapitalize="off" spellcheck="false">
      <button class="btn btn-primary btn-sm" type="submit">Load</button>
    </form>

    <div class="controls">
      <button class="ctl" id="playBtn" type="button" disabled>▶</button>
      <span class="time" id="timeNow">0:00</span>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" disabled>
      <span class="time" id="timeEnd">0:00</span>
      <button class="ctl" id="muteBtn" type="button" disabled>🔊</button>
      <button class="ctl" id="fsBtn" type="button">⛶</button>
    </div>

    <section class="chat">
      <div class="chat-head">
        <span class="chat-title">Chat</span>
        <span class="chat-hint" id="chatHint"></span>
      </div>
      <div class="reactions" id="reactionBar">
        <button class="reaction-btn" type="button" data-emoji="❤️">❤️</button>
        <button class="reaction-btn" type="button" data-emoji="😂">😂</button>
        <button class="reaction-btn" type="button" data-emoji="😮">😮</button>
        <button class="reaction-btn" type="button" data-emoji="😢">😢</button>
        <button class="reaction-btn" type="button" data-emoji="👏">👏</button>
        <button class="reaction-btn" type="button" data-emoji="🔥">🔥</button>
        <button class="reaction-btn" type="button" data-emoji="👍">👍</button>
        <button class="reaction-btn" type="button" data-emoji="🎉">🎉</button>
      </div>
      <div class="chat-list" id="chatList" role="log" aria-live="polite"></div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <input id="chatInput" class="input" type="text" maxlength="600" placeholder="Write a message…">
      <button class="btn btn-primary btn-send" type="submit">Send</button>
    </form>

    <footer class="room-foot">
      <button class="btn btn-danger btn-block" id="leaveBtn" type="button">Leave Room</button>
    </footer>
  </div>

  <button class="fs-exit" id="fsExit" type="button">✕</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

/* =========================================================
   CONFIG
   ========================================================= */
const SUPABASE_URL  = 'https://fbqdpoqkbzbzvbrywaek.supabase.co';
const SUPABASE_ANON = 'sb_publishable_n-I8VgfUDnH3J35KZrLYsw_j1XTn0E5';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession:false, autoRefreshToken:false },
  realtime: { params: { eventsPerSecond: 10 } },
});

const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const CODE_LEN = 6;
const PEER_PREFIX = 'wtw-yt-v2-';
const MAX_PARTICIPANTS = 3;
const HEARTBEAT_MS = 5000;
const DRIFT_TOLERANCE = 2;
const CHAT_HISTORY = 60;
const K_NAME = 'wtw.name';
const K_ID = 'wtw.clientId';

const $ = sel => document.querySelector(sel);

/* =========================================================
   Helpers
   ========================================================= */
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2,'0'));
  return `${h.slice(0,4).join('')}-${h.slice(4,6).join('')}-${h.slice(6,8).join('')}-${h.slice(8,10).join('')}-${h.slice(10,16).join('')}`;
}
function getClientId(){
  let id = null;
  try{ id = localStorage.getItem(K_ID); }catch{}
  if(!id){ id = uuid(); try{ localStorage.setItem(K_ID, id); }catch{} }
  return id;
}
function getName(){ try{ return localStorage.getItem(K_NAME) || ''; }catch{ return ''; } }
function setName(n){ try{ localStorage.setItem(K_NAME, n); }catch{} }
function makeCode(){
  const bytes = new Uint8Array(CODE_LEN);
  crypto.getRandomValues(bytes);
  let out = '';
  for(let i=0;i<CODE_LEN;i++) out += ALPHABET[bytes[i] % ALPHABET.length];
  return out;
}
function normalizeCode(raw){
  return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,CODE_LEN);
}
function fmtTime(sec){
  const total = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
             : `${m}:${String(s).padStart(2,'0')}`;
}
let toastTimer = 0;
function toast(msg, ms = 2600){
  const el = $('#toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function withTimeout(promise, ms, label){
  let timer;
  return Promise.race([
    Promise.resolve(promise).finally(() => clearTimeout(timer)),
    new Promise((_, rej) => { timer = setTimeout(() => rej(new Error(`${label} timed out.`)), ms); }),
  ]);
}
function withSoftTimeout(promise, ms, fallback){
  let timer;
  return Promise.race([
    Promise.resolve(promise).finally(() => clearTimeout(timer)),
    new Promise(res => { timer = setTimeout(() => res(fallback), ms); }),
  ]);
}
function friendly(err, fallback='Something went wrong. Please try again.'){
  const msg = String(err?.message || err || '');
  if(/Failed to fetch|NetworkError|Load failed/i.test(msg)) return "Can't reach the server.";
  if(/duplicate key/i.test(msg)) return 'That code is already taken.';
  if(/row-level security|permission denied/i.test(msg)) return 'That action is not allowed.';
  if(/JWT|apikey/i.test(msg)) return 'App is not configured correctly.';
  return fallback;
}

/* =========================================================
   YouTube API — resolves against the preloaded script
   ========================================================= */
let ytApiPromise = null;
function loadYouTubeApi(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve, reject) => {
    if(window.YT && window.YT.Player){ resolve(window.YT); return; }
    const timer = setTimeout(() => reject(new Error('YouTube API load timeout.')), 20000);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => {
      clearTimeout(timer);
      if(typeof prev === 'function') prev();
      resolve(window.YT);
    };
    // Belt and braces: also poll briefly, in case the script already fired
    // its callback before this module ran.
    let tries = 0;
    const poll = setInterval(() => {
      tries++;
      if(window.YT && window.YT.Player){
        clearInterval(poll);
        clearTimeout(timer);
        resolve(window.YT);
      } else if(tries > 40){
        clearInterval(poll);
      }
    }, 250);
  });
  return ytApiPromise;
}

function parseYouTubeId(input){
  const raw = String(input || '').trim();
  if(!raw) return null;
  if(/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
  let url;
  try{ url = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`); } catch { return null; }
  const host = url.hostname.replace(/^www\.|^m\./i,'');
  if(host === 'youtu.be'){
    const id = url.pathname.slice(1).split('/')[0];
    return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  }
  if(host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')){
    const v = url.searchParams.get('v');
    if(v && /^[A-Za-z0-9_-]{11}$/.test(v)) return v;
    const m = url.pathname.match(/\/(?:embed|shorts|live|v)\/([A-Za-z0-9_-]{11})/);
    if(m) return m[1];
  }
  return null;
}

/* =========================================================
   Supabase ops
   ========================================================= */
async function createRoom(name){
  const clientId = getClientId();
  let lastErr = null;
  for(let attempt=0; attempt<6; attempt++){
    const code = makeCode();
    const { data, error } = await sb.from('rooms').insert({ code, host_id: clientId }).select('*').single();
    if(!error && data){
      const { error: pErr } = await sb.from('participants').insert({
        room_id: data.id, client_id: clientId, name, is_host: true,
      });
      if(pErr && pErr.code !== '23505') throw new Error(friendly(pErr));
      return data;
    }
    lastErr = error;
    if(error && error.code !== '23505') break;
  }
  throw new Error(friendly(lastErr, 'Could not create a room.'));
}
async function findRoom(code){
  const { data, error } = await sb.from('rooms').select('*').eq('code', code).maybeSingle();
  if(error) throw new Error(friendly(error, 'Could not check that room code.'));
  return data || null;
}
function roomIsClosed(room){
  if(!room) return true;
  if(room.closed_at) return true;
  if(room.expires_at && new Date(room.expires_at).getTime() < Date.now()) return true;
  return false;
}
async function joinRoom(room, name){
  const clientId = getClientId();
  const { data, error } = await sb.from('participants').upsert({
    room_id: room.id, client_id: clientId, name,
    is_host: room.host_id === clientId,
    joined_at: new Date().toISOString(),
    last_seen: new Date().toISOString(),
  }, { onConflict: 'room_id,client_id' }).select('*').single();
  if(error) throw new Error(friendly(error, 'Could not join that room.'));
  return data;
}
async function leaveRoomDb(roomId, clientId){
  await sb.from('participants').delete().eq('room_id', roomId).eq('client_id', clientId);
}
async function closeRoomDb(roomId){
  await sb.from('rooms').update({ closed_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', roomId);
}
async function reopenRoomDb(roomId){
  const { error } = await sb.from('rooms').update({ closed_at: null, updated_at: new Date().toISOString() }).eq('id', roomId);
  if(error) throw new Error(friendly(error, 'Could not reopen the room.'));
}
async function persistStateDb(roomId, state){
  await sb.from('rooms').update({ state, updated_at: new Date().toISOString() }).eq('id', roomId);
}
async function touchParticipant(roomId, clientId){
  await sb.from('participants').update({ last_seen: new Date().toISOString() }).eq('room_id', roomId).eq('client_id', clientId);
}
async function countParticipants(roomId){
  const cutoff = new Date(Date.now() - 60000).toISOString();
  const { count } = await sb.from('participants').select('id', { count:'exact', head:true }).eq('room_id', roomId).gte('last_seen', cutoff);
  return count || 0;
}
async function loadRecentMessages(roomId, limit = CHAT_HISTORY){
  const { data, error } = await sb.from('messages')
    .select('id, client_id, name, body, created_at')
    .eq('room_id', roomId).order('created_at', { ascending: false }).limit(limit);
  if(error) return [];
  return data.reverse();
}
async function sendMessageDb(roomId, clientId, name, body){
  const clean = String(body || '').trim().slice(0, 600);
  if(!clean) return;
  const { error } = await sb.from('messages').insert({ room_id: roomId, client_id: clientId, name, body: clean });
  if(error) throw new Error(friendly(error, 'Message could not be sent.'));
}

/* =========================================================
   MAIN BOOT — parallelized for speed
   ========================================================= */
const params = new URLSearchParams(location.search);
const roomCodeParam = normalizeCode(params.get('room') || params.get('c'));

async function bootInit(){
  // 1. Switch to room mode immediately so the boot screen is visible
  document.body.classList.remove('landing');
  document.body.classList.add('room');
  if(landing) landing.hidden = true;
  roomApp.hidden = false;
  roomContent.hidden = true;

  boot('Connecting…');

  if(!myName){ bootFail('Please enter your name on the home page first.'); return; }
  const code = roomCodeParam;
  if(code.length !== CODE_LEN){ bootFail('That room code is not valid.'); return; }
  codeValueEl.textContent = code;

  // 2. Find the room (blocking — needed before we can do anything else)
  let found;
  try{
    found = await withTimeout(findRoom(code), 12000, 'findRoom');
  }catch(err){
    console.error('[boot] findRoom failed', err);
    bootFail('Could not check the room. Please retry.', { retry:true });
    return;
  }
  if(!found){ bootFail('Room not found.'); return; }

  room = found;
  isHost = room.host_id === clientId;

  // 3. Closed / expired handling
  if(roomIsClosed(room)){
    const expired = !room.expires_at || new Date(room.expires_at).getTime() <= Date.now();
    if(isHost && !expired){
      bootScreen.classList.add('is-error');
      bootText.textContent = 'This room was closed. Reopen it?';
      bootRetry.hidden = false;
      bootRetry.disabled = false;
      bootRetry.textContent = 'Reopen Room';
      bootRetry.onclick = async () => {
        bootRetry.disabled = true;
        bootRetry.textContent = 'Reopening…';
        try{ await reopenRoomDb(room.id); location.reload(); }
        catch(err){
          bootRetry.disabled = false;
          bootRetry.textContent = 'Try again';
          bootText.textContent = err.message || 'Could not reopen the room.';
        }
      };
      bootBack.hidden = false;
      bootBack.onclick = () => { location.href = location.pathname; };
      return;
    }
    bootFail('That room has already ended.');
    return;
  }

  // 4. Guest: participant count check (quick)
  if(!isHost){
    try{
      const count = await withSoftTimeout(countParticipants(room.id), 3000, 0);
      if(count >= MAX_PARTICIPANTS){ bootFail('This room is full.'); return; }
    }catch{}
  }

  // 5. Wire UI *before* joinRoom resolves, so we're ready to draw the instant it does
  setupPlayer();
  setupControls();
  setupChat();
  setupChrome();
  setupReactions();
  setupFullscreen();

  chatHint.textContent = isHost ? 'You are the host' : 'Only the host controls playback';
  playBtn.disabled = !isHost;
  seekEl.disabled = !isHost;
  muteBtn.disabled = !isHost;
  sourceBar.hidden = !isHost;

  // 6. Join participants table
  try{
    await withTimeout(joinRoom(room, myName), 10000, 'joinRoom');
  }catch(err){
    console.error('[boot] joinRoom failed', err);
    bootFail('Could not join the room. Please retry.', { retry:true });
    return;
  }

  // 7. Show the room!
  bootDone();
  document.title = `Room ${code} — Watch Together`;
  appendSystem(isHost ? 'You created this room.' : 'You joined the room.');

  // =========================================================
  // 8. KICK OFF BACKGROUND WORK IN PARALLEL
  // =========================================================

  // (A) START LOADING THE VIDEO RIGHT NOW — this is the critical path
  if(room.state && room.state.kind === 'youtube' && room.state.src){
    currentState = room.state;
    currentVideoId = room.state.src;
    const p = isHost
      ? loadVideoAsHost(room.state.src, { restore:true })
      : loadVideoForGuest(room.state.src);
    p.catch(err => console.warn('[video] initial load failed', err));
  }

  // (B) Chat history — background
  loadRecentMessages(room.id)
    .then(rows => {
      if(rows && rows.length){
        chatList.replaceChildren();
        for(const m of rows) appendChat({
          client_id: m.client_id, name: m.name, body: m.body,
          ts: new Date(m.created_at).getTime(),
        });
        chatList.scrollTop = chatList.scrollHeight;
      }
    })
    .catch(() => {});

  // (C) Realtime channel — background
  openChannel().catch(err => {
    console.warn('[RT] channel failed', err);
    // Non-fatal: chat inserts won't stream, reactions won't broadcast.
  });

  // (D) PeerJS — background
  try{ setupPeerJs(); }catch(err){ console.warn('[PEER] setup failed', err); }

  // (E) Participant heartbeat
  startParticipantHeartbeat();
}

/* =========================================================
   Supabase realtime channel
   ========================================================= */
function openChannel(){
  return new Promise((resolve, reject) => {
    if(channel){ try{ sb.removeChannel(channel); }catch{} channel = null; }
    let settled = false;
    const settle = (kind, val) => {
      if(settled) return;
      settled = true;
      kind === 'resolve' ? resolve(val) : reject(val);
    };

    try{
      channel = sb.channel(`room:${room.code}`, {
        config: {
          broadcast: { self:false },
          presence: { key: clientId },
        },
      });
    }catch(err){ settle('reject', err); return; }

    channel.on('presence', { event:'sync' }, () => handlePresence());

    channel.on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `room_id=eq.${room.id}`,
    }, ({ new: row }) => {
      appendChat({
        client_id: row.client_id, name: row.name, body: row.body,
        ts: new Date(row.created_at).getTime(),
      });
    });

    channel.on('broadcast', { event:'reaction' }, ({ payload }) => showReaction(payload));

    const timer = setTimeout(() => {
      try{ channel?.unsubscribe(); }catch{}
      settle('reject', new Error('Realtime timed out.'));
    }, 12000);

    channel.subscribe((status) => {
      console.log('[RT]', status);
      if(status === 'SUBSCRIBED'){
        clearTimeout(timer);
        channel.track({ name: myName, is_host: isHost }).catch(()=>{});
        settle('resolve');
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
        clearTimeout(timer);
        settle('reject', new Error('Realtime: ' + status));
      }
    });
  });
}

function handlePresence(){
  if(!channel) return;
  const state = channel.presenceState();
  const ids = new Set();
  let hostPresent = false;
  for(const [key, values] of Object.entries(state)){
    if(!values || !values.length) continue;
    ids.add(key);
    for(const v of values){
      if(v.is_host) hostPresent = true;
      if(v.name) peerNames[key] = v.name;
    }
  }
  onlineCountEl.textContent = String(ids.size || 1);
  if(!isHost){
    if(!hostPresent && ids.size > 0){
      if(!hostGraceTimer){
        toast('The host disconnected. Waiting…', 5000);
        hostGraceTimer = setTimeout(() => endSession('The host left.'), 90000);
      }
    } else if(hostPresent && hostGraceTimer){
      clearTimeout(hostGraceTimer);
      hostGraceTimer = 0;
      toast('The host is back.');
    }
  }
}

/* =========================================================
   PeerJS
   ========================================================= */
function setupPeerJs(){
  const wantedId = PEER_PREFIX + room.code.toLowerCase();
  try{
    peer = isHost ? new Peer(wantedId, { debug:1 }) : new Peer({ debug:1 });
  }catch(err){ console.warn('[PEER] create failed', err); return; }

  if(isHost){
    peer.on('open', id => console.log('[PEER] host open', id));
    peer.on('connection', conn => setupConnection(conn));
    peer.on('error', err => {
      console.warn('[PEER] host error', err.type);
      if(err.type === 'unavailable-id') toast('Live sync busy. Chat still works.', 4000);
    });
  } else {
    peer.on('open', () => {
      const conn = peer.connect(wantedId, { reliable:true, metadata:{ name: myName } });
      const timer = setTimeout(() => {
        if(!hostConn) toast('Live sync unavailable. Chat still works.', 4000);
      }, 8000);
      conn.on('open', () => {
        clearTimeout(timer);
        hostConn = conn;
        setupConnection(conn);
        sendToHost({ type:'hello', name: myName });
      });
      conn.on('error', err => console.warn('[PEER] guest conn error', err));
    });
    peer.on('error', err => console.warn('[PEER] guest error', err.type));
  }
}

function setupConnection(conn){
  if(!peerConnections.includes(conn)) peerConnections.push(conn);
  if(!isHost) hostConn = conn;
  conn.on('data', data => handlePeerMessage(data, conn));
  conn.on('close', () => {
    peerConnections = peerConnections.filter(c => c !== conn);
    if(!isHost && conn === hostConn) hostConn = null;
    const nm = peerNames[conn.peer] || 'Guest';
    delete peerNames[conn.peer];
    appendSystem(`${nm} left the room.`);
  });
  conn.on('error', err => console.warn('[PEER] conn error', err));
}

function sendToHost(msg){
  if(hostConn && hostConn.open){ try{ hostConn.send(msg); }catch{} }
}
function broadcastPeer(msg, except = null){
  for(const c of peerConnections){
    if(c !== except && c.open){ try{ c.send(msg); }catch{} }
  }
}
function sendTo(conn, msg){
  if(conn && conn.open){ try{ conn.send(msg); }catch{} }
}

function handlePeerMessage(data, fromConn){
  if(!data || typeof data !== 'object') return;
  switch(data.type){
    case 'hello':
      peerNames[fromConn.peer] = (data.name || 'Guest').slice(0,18);
      if(isHost && currentVideoId){
        sendTo(fromConn, { type:'state', state: buildLiveState() });
      }
      break;
    case 'state':
      if(!isHost) applyRemoteState(data.state);
      break;
    case 'request-sync':
      if(isHost && currentVideoId) sendTo(fromConn, { type:'state', state: buildLiveState() });
      break;
  }
}

/* =========================================================
   YouTube player
   ========================================================= */
function setupPlayer(){ /* lazy */ }

async function loadVideoAsHost(videoId, { restore=false } = {}){
  if(!isHost || !videoId) return;
  stageEmpty.hidden = true;
  ytWrap.hidden = false;

  const YT = await loadYouTubeApi();
  if(player && ytReady && currentVideoId === videoId){
    pushState({}, { force:true });
    return;
  }
  if(player){ try{ player.destroy(); }catch{} player = null; ytReady = false; }
  ytHost.replaceChildren();
  currentVideoId = videoId;

  await new Promise(resolve => {
    player = new YT.Player(ytHost, {
      videoId,
      width: '100%', height: '100%',
      playerVars: {
        controls: 0, disablekb: 1, modestbranding: 1,
        rel: 0, playsinline: 1, fs: 0, iv_load_policy: 3,
        origin: location.origin,
      },
      events: {
        onReady: () => { ytReady = true; resolve(); },
        onStateChange: (e) => {
          if(applyingRemote) return;
          if(e.data === 1 || e.data === 2 || e.data === 0) pushState({}, { force:true });
        },
        onError: () => toast('That YouTube video cannot be played here.'),
      }
    });
  });

  if(!restore){
    pushState({ kind:'youtube', src:videoId, playing:false, position:0, at:Date.now() },
              { force:true, replace:true });
  }
}

async function loadVideoForGuest(videoId){
  if(!videoId) return;
  stageEmpty.hidden = true;
  ytWrap.hidden = false;

  const YT = await loadYouTubeApi();
  if(player){ try{ player.destroy(); }catch{} player = null; ytReady = false; }
  ytHost.replaceChildren();
  currentVideoId = videoId;

  await new Promise(resolve => {
    player = new YT.Player(ytHost, {
      videoId,
      width: '100%', height: '100%',
      playerVars: {
        controls: 0, disablekb: 1, modestbranding: 1,
        rel: 0, playsinline: 1, fs: 0, iv_load_policy: 3,
        origin: location.origin,
      },
      events: {
        onReady: () => {
          ytReady = true;
          if(!userHasInteracted) tapPlay.hidden = false;
          resolve();
        },
        onError: () => toast('That YouTube video cannot be played here.'),
      }
    });
  });

  applyPlaybackState(currentState);
}

function buildLiveState(){
  let pos = currentState.position || 0;
  let playing = !!currentState.playing;
  if(player && ytReady){
    try{
      pos = Number(player.getCurrentTime?.() || 0);
      playing = player.getPlayerState?.() === 1;
    }catch{}
  }
  return { kind:'youtube', src: currentVideoId, playing, position: pos, at: Date.now() };
}

function pushState(patch = {}, opts = {}){
  if(!isHost) return;
  const now = Date.now();
  if(!opts.force && now - lastPersist < 350) return;

  let next;
  if(opts.replace){
    next = { kind:'youtube', src: patch.src || currentVideoId, playing:false, position:0, at:now };
  } else {
    next = buildLiveState();
    if(patch.position !== undefined) next.position = patch.position;
    if(patch.playing !== undefined) next.playing = patch.playing;
  }
  currentState = next;

  broadcastPeer({ type:'state', state: next });

  if(now - lastPersist > 8000 || opts.persist){
    lastPersist = now;
    persistStateDb(room.id, next).catch(()=>{});
  }
  refreshControls();
}

function applyRemoteState(state){
  if(!state || typeof state !== 'object') return;
  const targetId = state.src;
  const isNewVideo = targetId && targetId !== currentVideoId;
  currentState = state;
  currentVideoId = targetId;

  if(isNewVideo){
    loadVideoForGuest(targetId).then(() => applyPlaybackState(state));
  } else if(player && ytReady){
    applyPlaybackState(state);
  }
}

function applyPlaybackState(state){
  if(!player || !ytReady) return;
  if(state.kind !== 'youtube') return;

  const elapsed = state.playing ? (Date.now() - (state.at || Date.now()))/1000 : 0;
  const target = Math.max(0, Number(state.position || 0) + elapsed);

  applyingRemote = true;
  try{
    const current = Number(player.getCurrentTime?.() || 0);
    if(Math.abs(current - target) > DRIFT_TOLERANCE) player.seekTo(target, true);
    const isPlaying = player.getPlayerState?.() === 1;
    if(state.playing && !isPlaying){
      if(userHasInteracted) player.playVideo();
      else tapPlay.hidden = false;
    } else if(!state.playing && isPlaying){
      player.pauseVideo();
    }
  }catch{}
  setTimeout(() => { applyingRemote = false; }, 700);
  refreshControls();
}

/* =========================================================
   Controls
   ========================================================= */
function setupControls(){
  playBtn.addEventListener('click', () => {
    if(!isHost || !player || !ytReady) return;
    userHasInteracted = true;
    tapPlay.hidden = true;
    const playing = player.getPlayerState?.() === 1;
    applyingRemote = true;
    if(playing) player.pauseVideo(); else player.playVideo();
    setTimeout(() => {
      applyingRemote = false;
      pushState({}, { force:true });
    }, 250);
  });

  muteBtn.addEventListener('click', () => {
    if(!isHost || !player || !ytReady) return;
    try{
      if(player.isMuted?.()){ player.unMute(); muteBtn.textContent = '🔊'; }
      else { player.mute(); muteBtn.textContent = '🔇'; }
    }catch{}
  });

  seekEl.addEventListener('input', () => {
    draggingSeek = true;
    if(player && ytReady){
      const d = Number(player.getDuration?.() || 0);
      if(d > 0) timeNow.textContent = fmtTime((Number(seekEl.value)/1000) * d);
    }
  });
  seekEl.addEventListener('change', () => {
    draggingSeek = false;
    if(!isHost || !player || !ytReady) return;
    const d = Number(player.getDuration?.() || 0);
    if(d <= 0) return;
    const target = (Number(seekEl.value)/1000) * d;
    applyingRemote = true;
    player.seekTo(target, true);
    setTimeout(() => {
      applyingRemote = false;
      pushState({ position: target, at: Date.now() }, { force:true });
    }, 400);
  });

  sourceBar.addEventListener('submit', (e) => {
    e.preventDefault();
    if(!isHost) return;
    const raw = sourceInput.value.trim();
    if(!raw) return;
    const id = parseYouTubeId(raw);
    if(!id){ toast('That does not look like a YouTube link.'); return; }
    sourceInput.value = '';
    sourceInput.blur();
    loadVideoAsHost(id).catch(err => toast(err.message || 'Could not load video.'));
  });

  setInterval(() => {
    if(!player || !ytReady || draggingSeek) return;
    try{
      const cur = Number(player.getCurrentTime?.() || 0);
      const dur = Number(player.getDuration?.() || 0);
      if(dur > 0){
        seekEl.value = String(Math.round((cur/dur) * 1000));
        timeNow.textContent = fmtTime(cur);
        timeEnd.textContent = fmtTime(dur);
      }
      playBtn.textContent = player.getPlayerState?.() === 1 ? '❚❚' : '▶';
    }catch{}
  }, 400);

  tapPlay.addEventListener('click', () => {
    userHasInteracted = true;
    tapPlay.hidden = true;
    if(player && ytReady){
      try{ player.playVideo(); }catch{}
      if(!isHost) sendToHost({ type:'request-sync' });
      applyPlaybackState(currentState);
    }
  });

  backLink.addEventListener('click', (e) => {
    e.preventDefault();
    if(!confirm('Leave the room?')) return;
    leaveRoom();
  });

  leaveBtn.addEventListener('click', () => {
    if(isHost){
      if(!confirm('You are the host. Leaving will end the room for everyone.\n\nEnd the session?')) return;
      leaveRoom({ endRoom:true });
    } else {
      if(!confirm('Leave the room?')) return;
      leaveRoom();
    }
  });

  heartbeatTimer = setInterval(() => {
    if(!isHost) return;
    if(currentState.kind === 'youtube' && player && ytReady) pushState({}, { force:true });
  }, HEARTBEAT_MS);
}

function refreshControls(){
  if(player && ytReady){
    playBtn.textContent = player.getPlayerState?.() === 1 ? '❚❚' : '▶';
  }
}

/* =========================================================
   Chat
   ========================================================= */
function appendChat(msg){
  const mine = msg.client_id === clientId;
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (mine ? ' me' : '');
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = mine ? 'You' : (msg.name || 'Guest');
  const body = document.createElement('span');
  body.className = 'body';
  body.textContent = msg.body;
  const t = document.createElement('span');
  t.className = 'time';
  try{ t.textContent = new Date(msg.ts || Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }catch{}
  wrap.append(who, body, t);
  chatList.appendChild(wrap);
  chatList.scrollTop = chatList.scrollHeight;
}
function appendSystem(text){
  const el = document.createElement('div');
  el.className = 'msg sys';
  el.textContent = text;
  chatList.appendChild(el);
  chatList.scrollTop = chatList.scrollHeight;
}

function setupChat(){
  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if(!text) return;
    chatInput.value = '';
    try{
      await sendMessageDb(room.id, clientId, myName, text);
    }catch(err){
      toast(err.message || 'Message could not be sent.');
      chatInput.value = text;
    }
  });
  chatInput.addEventListener('focus', () => {
    setTimeout(() => { chatList.scrollTop = chatList.scrollHeight; }, 260);
  });
}

/* =========================================================
   Reactions
   ========================================================= */
function setupReactions(){
  reactionBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.reaction-btn');
    if(!btn) return;
    const emoji = btn.dataset.emoji;
    if(!emoji) return;
    const payload = { emoji, name: myName };
    showReaction(payload);
    channel?.send({ type:'broadcast', event:'reaction', payload });
  });
}
function showReaction(payload){
  if(!payload || !payload.emoji) return;
  const el = document.createElement('span');
  el.className = 'reaction-float';
  el.textContent = payload.emoji;
  el.style.left = (8 + Math.random() * 84) + '%';
  el.style.setProperty('--drift', `${(Math.random()*60 - 30).toFixed(1)}deg`);
  el.style.fontSize = `${Math.round(36 * (0.9 + Math.random()*0.3))}px`;
  reactionLayer.appendChild(el);
  const cleanup = () => { if(el.parentNode) el.parentNode.removeChild(el); };
  el.addEventListener('animationend', cleanup, { once:true });
  setTimeout(cleanup, 3600);
}

/* =========================================================
   Chrome
   ========================================================= */
function setupChrome(){
  codeChip.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(room.code); toast('Room code copied.'); }
    catch{ toast(`Room code: ${room.code}`, 4000); }
  });
  shareBtn.addEventListener('click', async () => {
    const url = new URL(location.href);
    url.search = `?room=${room.code}`;
    if(navigator.share){
      try{ await navigator.share({ title:'Watch Together', text:`Join with code ${room.code}`, url: url.toString() }); return; }catch{}
    }
    try{ await navigator.clipboard.writeText(url.toString()); toast('Invite link copied.'); }
    catch{ toast(`Room code: ${room.code}`, 4000); }
  });
}

/* =========================================================
   Fullscreen
   ========================================================= */
function setupFullscreen(){
  fsBtn.addEventListener('click', toggleFullscreen);
  fsExitBtn.addEventListener('click', () => {
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  });
  document.addEventListener('fullscreenchange', () => {
    const active = document.fullscreenElement === roomApp;
    document.body.classList.toggle('is-fullscreen', active);
    if(active){
      const coarse = window.matchMedia?.('(pointer: coarse)').matches;
      if(coarse && screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
    } else {
      try{ screen.orientation?.unlock?.(); }catch{}
    }
  });
}
function toggleFullscreen(){
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else if(roomApp.requestFullscreen) roomApp.requestFullscreen({ navigationUI:'hide' }).catch(()=> toast('Fullscreen not available.'));
  else toast('Fullscreen not available.');
}

/* =========================================================
   Participant upkeep
   ========================================================= */
function startParticipantHeartbeat(){
  clearInterval(participantTimer);
  participantTimer = setInterval(() => {
    if(leaving || !room) return;
    touchParticipant(room.id, clientId).catch(()=>{});
  }, 25000);
}

/* =========================================================
   Leave / cleanup
   ========================================================= */
function endSession(reason){
  if(leaving) return;
  leaving = true;
  clearInterval(heartbeatTimer);
  clearInterval(participantTimer);
  clearTimeout(hostGraceTimer);
  try{ player?.destroy(); }catch{}
  try{ peer?.destroy(); }catch{}
  toast(reason, 3000);
  setTimeout(() => { location.href = location.pathname; }, 1600);
}

async function leaveRoom({ endRoom=false } = {}){
  if(leaving) return;
  leaving = true;
  clearInterval(heartbeatTimer);
  clearInterval(participantTimer);
  clearTimeout(hostGraceTimer);
  try{ player?.destroy(); }catch{}
  if(peer){ try{ peer.destroy(); }catch{} peer = null; }
  if(channel){
    try{ await channel.untrack(); }catch{}
    try{ await sb.removeChannel(channel); }catch{}
    channel = null;
  }
  if(room){
    try{ await leaveRoomDb(room.id, clientId); }catch{}
    if(endRoom) try{ await closeRoomDb(room.id); }catch{}
  }
  location.href = location.pathname;
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  if(!channel || leaving || !room) return;
  channel.track({ name: myName, is_host: isHost }).catch(()=>{});
  touchParticipant(room.id, clientId).catch(()=>{});
});

window.addEventListener('beforeunload', () => {
  if(leaving) return;
  try{ peer?.destroy(); }catch{}
});

/* =========================================================
   Kick off
   ========================================================= */
if(roomCodeParam){
  bootInit().catch(err => {
    console.error('[bootInit] uncaught', err);
    bootFail(err.message || 'Could not open this room.', { retry:true });
  });
}
</script>
