<!-- assets/icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     role="img"
     aria-label="Watch Together">
  <defs>
    <linearGradient id="wtGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <radialGradient id="wtGlow" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded app-style tile -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#wtGradient)"/>

  <!-- Soft highlight for depth -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#wtGlow)"/>

  <!-- Play triangle -->
  <path d="M25 19v26l20-13-20-13z" fill="#ffffff"/>
</svg>